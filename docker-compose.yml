services:
  opencode-server:
    image: ghcr.io/${GITHUB_USERNAME:-zavaruev}/my-opencode-server-docker:latest
    container_name: opencode-server
    restart: unless-stopped

    user: "${UID}:${GID}"
    group_add:
      - "${DOCKER_GID}"

    # Рабочая директория перенесена в /workspace во избежание сбоев индексации каталога /home/node
    working_dir: /workspace

    command: ["serve", "--hostname", "0.0.0.0", "--port", "4096"]

    ports:
      - "${OPENCODE_SERVER_PORT}:4096"

    environment:
      - NODE_ENV=production
      - HOME=/home/node
      # GITHUB_PAT из .env маппится под имя, которое ожидает OpenCode.
      # (если переименуете в .env GITHUB_PAT -> GITHUB_PERSONAL_ACCESS_TOKEN,
      # эту строку можно удалить)
      - GITHUB_PERSONAL_ACCESS_TOKEN=${GITHUB_PAT}

    # Пароль и ключи берутся напрямую из .env. ВАЖНО: значения env_file не
    # перекрываются переменными shell-окружения, в отличие от ${}-подстановок
    # выше: compose при разрешении ${VAR} сначала смотрит в окружение процесса
    # и только потом в .env. Сессии агентов наследуют OPENCODE_SERVER_PASSWORD
    # из host-процесса opencode, из-за чего пароль из .env подменялся старым
    # значением из окружения ("херня с паролями"). Поэтому секреты — только
    # через env_file.
    env_file:
      - .env

    volumes:
      - ./.home:/home/node
      - ${WORKSPACE_DIR}:/workspace:rw
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.gitconfig:/home/node/.gitconfig:ro
      - ~/.ssh:/home/node/.ssh:ro

    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - 192.168.22.1
